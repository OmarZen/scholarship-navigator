name: label pull requests

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      # Safe with pull_request_target: this job never checks out or runs the pull request's code.
      - uses: actions/labeler@v5
        with:
          sync-labels: true
