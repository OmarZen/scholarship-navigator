name: welcome first-time contributors

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      # Safe with pull_request_target: only posts a comment, never runs the pull request's code.
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            👋 Thanks for opening your first issue, and for helping students find scholarships!
            If it is about data (a deadline, a rule, a program), please make sure it links the **official** source.
            A maintainer will reply soon.
          pr-message: |
            🎉 Thanks for your first pull request to Scholarship Navigator!
            What happens next:
            1. CI runs the tests and data checks (a maintainer may need to approve the first run).
            2. A maintainer reviews it. Every pull request is reviewed before it is merged.
            3. If changes are requested, push more commits to the same branch.
            Please check the PR template boxes, and link an official source for every changed fact.
