name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[mcp]"
      - name: Validate data
        run: python cli.py validate
      - name: Skills in sync
        run: python scripts/sync_skills.py --check
      - name: Catalogue pages up to date
        run: python scripts/build_catalog_docs.py --check
      - name: Unit tests
        run: python -m unittest discover tests

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No personal workspaces, profiles or generated reports committed
        run: |
          bad=$(git ls-files | grep -E '^output/|^[^/]+\.(xlsx|ics)$|^candidate_profile\.json$' || true)
          if [ -n "$bad" ]; then echo "These files must not be committed:"; echo "$bad"; exit 1; fi
      - name: No large files (> 5 MB)
        run: |
          big=$(git ls-files -z | xargs -0 du -k 2>/dev/null | awk '$1 > 5120 {print $2}')
          if [ -n "$big" ]; then echo "Files over 5 MB:"; echo "$big"; exit 1; fi
