[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scholarship-navigator"
version = "2.1.0"
description = "Open-source scholarship finder for people and AI agents: eligibility, fit scores, missing papers, dated plans, Erasmus Mundus program finder, MCP server."
readme = "README.md"
license = "MIT"
authors = [{ name = "OmarZen" }]
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["scholarships", "erasmus-mundus", "study-abroad", "students", "mcp", "ai-agents", "claude"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Education",
    "Topic :: Education",
]
dependencies = [
    "openpyxl>=3.1.5",
    "pydantic>=2.10.0",
    "rich>=14.0.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.10"]
scrape = [
    "httpx>=0.28.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.32.0",
    "scrapling>=0.2.0",
    "scrapy>=2.11.0",
    "crawlee>=0.5.0",
    "crawl4ai>=0.4.0",
]
dev = []

[project.urls]
Homepage = "https://github.com/OmarZen/scholarship-navigator"
Issues = "https://github.com/OmarZen/scholarship-navigator/issues"
Changelog = "https://github.com/OmarZen/scholarship-navigator/blob/main/CHANGELOG.md"

[project.scripts]
scholarship = "cli:main"
scholarship-mcp = "mcp_server:main"

[tool.setuptools]
py-modules = ["cli", "mcp_server"]
packages = ["planner", "scraper"]
# Data files are read from the repository checkout: install in editable mode (pip install -e .).
